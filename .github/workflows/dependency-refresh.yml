name: E2E dependency refresh

on:
  pull_request:
  push:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  poetry-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Validate and install locked dependencies
        run: |
          poetry check --lock
          poetry sync --no-root --no-interaction --no-ansi
      - name: Compile and discover Behave scenarios
        run: |
          poetry run python -m compileall -q features page_objects utils
          poetry run python -m unittest discover -s tests -v
          poetry run python -c "from utils.browser_setup import setup_webdriver; assert callable(setup_webdriver)"
          poetry run behave --dry-run --no-color
