name: E2E framework tests

on:
  pull_request:
  push:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Install locked dependencies
        run: poetry install --no-interaction --no-ansi --no-root
      - name: Check dependency consistency
        run: poetry run pip check
      - name: Compile framework modules
        run: poetry run python -m compileall -q features page_objects utils
      - name: Run regression tests
        run: poetry run python -m unittest discover -s tests -v
      - name: Check Selenium Manager setup
        run: poetry run python -c "from utils.browser_setup import setup_webdriver; assert callable(setup_webdriver)"
      - name: Validate Behave scenarios and step mapping
        run: poetry run behave --dry-run --no-color
