[behave]
# General settings
# @drafts: telas que só existem nos Drafts do Web (rodar com --tags=drafts contra o Web integrado)
default_tags = not @skip and not @drafts
logging_level = INFO
show_timings = true
junit = true
junit_directory = reports
show_skipped = false
format = pretty
color = true

[behave.userdata]
# Default values that can be overridden via command line
BASE_URL = localhost:3000
API_URL = http://localhost:5000
ENV = development

[behave.formatters]
html = behave_html_formatter:HTMLFormatter

[behave.environments]
# Environment-specific settings
development =
    browser = chrome
    headless = false
    
testing =
    browser = chrome
    headless = true
    
ci =
    browser = chrome
    headless = true